# Prueba la app Android en un emulador: la instala, la abre y guarda lo que pasa (logcat), para ver si se cierra al arrancar.
name: APK prueba en emulador
on:
  workflow_dispatch:
  pull_request:
    paths: ['android/**', '.github/workflows/apk-prueba.yml']
permissions:
  contents: read
jobs:
  emulador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Compilar
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Abrir la app en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n io.github.rmalump.gpapers/com.google.androidbrowserhelper.trusted.LauncherActivity
            sleep 20
            adb logcat -d -b crash > crash.txt || true
            adb logcat -d > logcat.txt || true
            echo "===== CRASH ====="; cat crash.txt
            echo "===== APP ====="; grep -iE "gpapers|androidbrowserhelper|AndroidRuntime|TwaLauncher|FATAL" logcat.txt | head -200
            if grep -q "FATAL EXCEPTION" crash.txt logcat.txt; then exit 1; fi
