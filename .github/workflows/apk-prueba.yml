# Prueba la app Android en emuladores (Android 11, 13 y 14): la instala, la abre y comprueba a los 25 s que sigue en pantalla.
# Guarda una captura, el logcat y la ventana con el foco como artefactos, para ver qué pasa si se cierra al arrancar.
name: APK prueba en emulador
on:
  workflow_dispatch:
  pull_request:
    paths: ['android/**', '.github/workflows/apk-prueba.yml']
permissions:
  contents: read
jobs:
  emulador:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [30, 33, 34]   # Android 11, 13 y 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Compilar
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Abrir la app en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n io.github.rmalump.gpapers/com.google.androidbrowserhelper.trusted.LauncherActivity
            sleep 25
            adb shell dumpsys window | grep -E "mCurrentFocus|mFocusedApp" | tee foco.txt || true
            adb exec-out screencap -p > pantalla.png || true
            adb logcat -d -b crash > crash.txt || true
            adb logcat -d > logcat.txt || true
            echo "===== CRASH ====="; cat crash.txt
            echo "===== APP ====="; grep -iE "gpapers|androidbrowserhelper|AndroidRuntime|TwaLauncher|FATAL|ActivityManager.*(Killing|died)|cr_" logcat.txt | head -300
            if grep -q "FATAL EXCEPTION" crash.txt logcat.txt; then exit 1; fi
            # a los 25 s tiene que verse la app (en Chrome o en la propia app), no la pantalla de inicio del móvil
            if ! grep -qiE "chrome|gpapers" foco.txt; then echo "::error::La app no está en pantalla: se ha cerrado"; exit 1; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulador-android-api${{ matrix.api }}
          path: |
            pantalla.png
            logcat.txt
            foco.txt
          if-no-files-found: ignore
