<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src * data: blob:; connect-src 'self' data: blob: https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com https://api.crossref.org; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>Gestor de papers</title><meta name="description" content="Gestor de papers académicos: notas, secciones, etiquetas, citas en varios estilos y sincronización opcional con tu propio Google Drive."><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2457c5"><link rel="icon" href="icon-192.png"></head>
<body>
<header>
  <h1 id="appName">Papers</h1><span class="pj"><span class="pjs" aria-hidden="true">/</span><input id="pjName" maxlength="60" spellcheck="false" autocomplete="off" aria-label="Nombre del proyecto" title="Nombre del proyecto (su archivo JSON se llama igual). Escribe para cambiarlo." placeholder="Proyecto" data-oninput="pjSize(this)" data-onchange="pjRename(this.value)" data-onkeydown="pjKey(event,this)"><button id="pjBtn" data-onclick="pjMenu(event)" title="Proyectos: cambiar, crear o borrar" aria-label="Proyectos">▾</button></span><span id="pjProg" hidden><span class="pjb"></span><small></small></span><span id="fname"></span>
  <div class="row">
    <button id="syncBtn" data-onclick="syClick(event)" title="Conectar con Google Drive" aria-label="Conectar con Google Drive" data-st="off" hidden><span class="syi">🔄</span><span class="syl">Conectar con Google Drive</span><span class="syb"></span></button>
    <button data-onclick="save(false)" title="Guardar (Ctrl+S)" aria-label="Guardar">💾</button>
    <button data-onclick="openMenu(event)" title="Importar referencias: archivo (.bib, .ris, .txt de ScienceDirect), texto pegado (BibTeX, RIS o citas de Google Scholar) o DOI">📥 Importar</button>
    <button class="pri" data-onclick="openEx()">Exportar citas</button>
    <span class="fm"><button id="fmBtn" data-onclick="fmToggle(event)" aria-haspopup="true" aria-expanded="false" title="Abrir, guardar como, importar y autoguardado">Archivo ▾</button>
      <div id="fmenu" hidden>
        <button data-onclick="fmClose();doOpen()">📂 Abrir un archivo JSON…</button>
        <button data-onclick="fmClose();save(true)">💾 Guardar como…</button>
        <hr><div class="fmh">Importar referencias</div>
        <button data-onclick="fmClose();openImport('file')">📄 Desde archivo (.bib, .ris o .txt)…</button>
        <button data-onclick="fmClose();openImport('text')">📋 Pegar BibTeX, RIS o citas de Google Scholar…</button>
        <button data-onclick="fmClose();openImport('doi')">🔎 Buscar por DOI…</button>
        <hr><label><input type="checkbox" id="auto" data-onchange="setAuto(this)"> Autoguardado</label>
      </div></span>
  </div>
</header>
<div id="app">
  <aside id="side">
    <div id="sbGrip" data-onpointerdown="sbGripDown(event)" data-ondblclick="sbWidthReset()" title="Arrastra para cambiar el ancho de la barra · Doble clic: ancho normal" aria-hidden="true"></div>
    <button class="sh" data-onclick="sbToggle()" data-oncontextmenu="sbAllMenu(event)" title="Plegar / desplegar menú · Clic derecho: plegar o desplegar todos los grupos"><span class="ic">☰</span><span class="lbl">Menú</span></button>
    <div class="sg" id="sg-search"><div class="sgh"><button class="sh" data-onclick="sbGroup('search')" title="Buscar" aria-label="Buscar"><span class="ic">🔍</span><span class="dot" id="d-search" hidden></span></button><input id="q" type="search" placeholder="Título, autor o año" aria-label="Buscar" data-oninput="qSet(this.value)" data-onkeydown="onEnter(event,qSet,this.value,1)"></div>
      <div class="sb"><label><input type="checkbox" data-onchange="put(F,'inNotes',this.checked,render)"> Incluir notas y citas editadas</label></div></div>
    <div class="sg" id="sg-filt"><button class="sh" data-onclick="sbGroup('filt')" title="Filtros: secciones, etiquetas y lectura"><span class="ic">🎚️</span><span class="lbl">Filtros</span><span class="dot" id="d-filt" hidden></span></button>
      <div class="sb"><div class="fs" id="fs-sec"><div class="fh2"><button class="fhb" data-onclick="fsToggle('sec')" aria-expanded="true" title="Plegar o desplegar"><span class="car">▾</span><b>📁 Secciones</b></button><button class="fhx" data-onclick="svOpen(F.sec)" title="Ver las notas de la sección elegida (o de todas)">📄 Notas</button><button class="mgb" data-onclick="openMg('sections')" title="Gestionar secciones" aria-label="Gestionar secciones">✎<span class="mgl"> Gestionar</span></button></div><div class="fsb"><div id="secF"></div></div></div>
        <div class="fs" id="fs-tag"><div class="fh2"><button class="fhb" data-onclick="fsToggle('tag')" aria-expanded="true" title="Plegar o desplegar"><span class="car">▾</span><b>🏷️ Etiquetas</b></button><button class="fhx" id="modeB" data-onclick="modeMenu(event)" title="Cómo combinar varias etiquetas: que tenga alguna o todas las elegidas"></button><button class="mgb" data-onclick="openMg('tags')" title="Gestionar etiquetas" aria-label="Gestionar etiquetas">✎<span class="mgl"> Gestionar</span></button></div><div class="fsb"><input id="tagQ" type="search" placeholder="Buscar etiqueta…" aria-label="Buscar etiqueta" data-oninput="tagQSet(this.value)" hidden><div id="tagF"></div></div></div>
        <div class="fs" id="fs-read"><div class="fh2"><button class="fhb" data-onclick="fsToggle('read')" aria-expanded="true" title="Plegar o desplegar"><span class="car">▾</span><b>📖 Lectura</b></button><div id="readP" class="pjb" title=""></div></div><div class="fsb"><div id="readF"></div></div></div>
        <div class="fs" id="fs-rat"><div class="fh2"><b class="fht">⭐ Valoración</b><button class="fhx" id="minR" data-onclick="minRMenu(event)" title="Valoración mínima"></button></div></div>
        <div class="fs" id="fs-yr"><div class="fh2 yrs"><b class="fht">📅 Años</b><input id="yFrom" type="number" min="0" max="9999" placeholder="Desde" aria-label="Desde el año" data-onchange="setYears()"><span>–</span><input id="yTo" type="number" min="0" max="9999" placeholder="Hasta" aria-label="Hasta el año" data-onchange="setYears()"></div></div></div></div>
    <div class="sg fold" id="sg-sort"><button class="sh" data-onclick="sbGroup('sort')" title="Ordenar"><span class="ic">⇅</span><span class="lbl">Ordenar</span><span class="dot" id="d-sort" hidden></span></button>
      <div class="sb"><div id="sortUI"></div><label><input type="checkbox" id="grpChk" data-onchange="put(F,'group',this.checked,render)"> Agrupar por sección</label></div></div>
    <hr class="sbsep">
    <div class="sg" id="sg-fav"><div class="sgh"><button class="sh" data-onclick="sbGroup('fav')" title="Vistas: búsquedas y filtros guardados"><span class="ic">⭐</span><span class="lbl">Vistas</span></button><button class="fvadd" data-onclick="favNew()" title="Guardar la búsqueda, el orden y los filtros actuales con un nombre">＋ Guardar vista</button></div>
      <div class="sb"><div id="favN" hidden><input id="favName" maxlength="40" placeholder="Nombre de la vista" aria-label="Nombre de la vista" data-onkeydown="favKeyDown(event)"><small>Guarda aquí combinaciones de búsqueda, orden y filtros que uses a menudo.</small><div class="row"><button class="pri" data-onclick="favSaveForm()">Guardar</button><button data-onclick="favCancel()">Cancelar</button></div></div><div id="favL"></div></div></div>
    <div class="sg" id="sg-rec" hidden><button class="sh" data-onclick="sbGroup('rec')" title="Papers abiertos hace poco"><span class="ic">🕘</span><span class="lbl">Recientes</span></button>
      <div class="sb" id="recL"></div></div>
    <div class="sg" id="sg-sel" hidden><button class="sh" data-onclick="sbGroup('sel')" title="Papers seleccionados"><span class="ic">☑️</span><span class="lbl" id="selT">Selección</span></button>
      <div class="sb"><button class="pri" data-onclick="openEx()">Exportar citas…</button><button data-onclick="psOpen()">Mover o copiar a otro proyecto…</button><button data-onclick="selNone()">Quitar selección</button></div></div>
  <button class="sh" data-onclick="grOpen()" title="Gráfico de relaciones entre papers"><span class="ic">🕸️</span><span class="lbl">Relaciones</span></button>
  <button class="sh trb" data-onclick="trOpen()" title="Papelera"><span class="ic">🗑️</span><span class="lbl" id="trLbl">Papelera</span><span class="dot" id="d-tr" hidden></span></button>
  <button class="sh cfgb" data-onclick="openCfg()" title="Configuración"><span class="ic">⚙️</span><span class="lbl">Configuración</span></button>
  <hr class="sbsep">
  <div class="sgm fold" id="sg-more"><button class="sh shs shm" data-onclick="sbMore()" title="Ayuda y créditos" aria-expanded="false"><span class="ic">ℹ️</span><span class="lbl">Información</span><span class="car">▸</span></button>
    <div class="smb"><button class="sh shs" data-onclick="openHelp()" title="Ayuda (F1)"><span class="ic">❓</span><span class="lbl">Ayuda</span></button>
    <button class="sh shs" id="instBtn" data-onclick="appInstall()" title="Instalar la aplicación en este dispositivo" hidden><span class="ic">⬇️</span><span class="lbl">Añadir app</span></button>
    <button class="sh shs" data-onclick="openCred()" title="Créditos"><span class="ic">©️</span><span class="lbl">Créditos</span></button></div></div>
  <p class="sbinfo">Gestor papers: organiza tus papers y sincronízalos con tu Google Drive. · <a href="privacidad.html" data-onclick="event.preventDefault();openPriv()">Política de privacidad</a></p>
  </aside>
  <main>
    <div class="row"><button class="pri" data-onclick="openPaper()">+ Nuevo paper</button><button id="tbView" class="tg" data-onclick="viewToggle()" title="Cambiar entre tarjetas y tabla compacta"></button><div class="bar"><button id="tbSec" class="tg" data-onclick="put(F,'tbSec',!F.tbSec,render)" data-oncontextmenu="groupMenu(event)" title="Clic: mostrar u ocultar las secciones · Clic derecho: agrupar por sección"></button><div id="secF2" class="chips" hidden></div></div><div class="bar"><button id="tbTag" class="tg" data-onclick="put(F,'tbTag',!F.tbTag,render)" data-oncontextmenu="modeMenu(event)" title="Clic: mostrar u ocultar las etiquetas · Clic derecho: cómo combinarlas"></button><div id="tagF2" class="chips"></div></div><button id="selAll" class="tg" data-onclick="selVisible()" title="Seleccionar todos los papers que se ven">☑ Visibles</button><span id="count" title="Papers que se ven, del total del proyecto, y cuántos hay seleccionados"></span></div>
    <div id="actF" hidden></div>
    <div id="list"></div>
  </main>
</div>
<div id="ctx" hidden></div><dialog id="dlg"></dialog><dialog id="mg"></dialog><dialog id="ex"></dialog><dialog id="nv"></dialog><dialog id="cfg"></dialog><dialog id="imp"></dialog><dialog id="rv"></dialog><dialog id="sv"></dialog><dialog id="img"></dialog><dialog id="help"></dialog><dialog id="lk"></dialog><dialog id="tr"></dialog><dialog id="gr"></dialog><dialog id="sy"></dialog><dialog id="pv"></dialog><dialog id="cr"></dialog><dialog id="bk"></dialog><dialog id="dp"></dialog><dialog id="ps"></dialog>
<script src="js/modelo.js"></script><script src="js/citas.js"></script><script src="js/persistencia.js"></script><script src="js/importar.js"></script><script src="js/config.js"></script><script src="js/lista.js"></script><script src="js/edicion.js"></script><script src="js/drive.js"></script><script src="js/extras.js"></script><script src="app.js"></script></body></html>
